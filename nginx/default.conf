# HTTP server - redirect to HTTPS and handle Let's Encrypt verification
server {
    listen 80;
    server_name invoice.mannshelby.xyz localhost invoice.zeric.com _;  # ADD: localhost and wildcard
    
    # Add security headers including X-Frame-Options
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # ADD: Allow local access without redirect
    location / {
        # Check if accessing via localhost or local IP
        if ($host = invoice.mannshelby.xyz) {
            return 301 https://invoice.mannshelby.xyz$request_uri;
        }
        
        # Local network access - no redirect
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
    
    # ADD: API access for local network
    location /api/ {
        if ($host = invoice.mannshelby.xyz) {
            return 301 https://invoice.mannshelby.xyz$request_uri;
        }
        
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    
    # ADD: Health check endpoint
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name invoice.mannshelby.xyz;
    
    # SSL certificates
    ssl_certificate /etc/nginx/ssl/live/invoice.mannshelby.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/invoice.mannshelby.xyz/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Add security headers including X-Frame-Options
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;    
    
    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API backend
    location /api/ {
        proxy_pass http://backend:8000/api/;  # CHANGE: php-prod to backend (match docker-compose)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # ADD: Timeout for long requests
        proxy_connect_timeout 300s;  # ADD: Connection timeout
    }
    
    # ADD: Health check endpoint
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
    
    # ADD: Storage file access
    location /storage {
        proxy_pass http://backend:8000/storage;
        proxy_set_header Host $host;
    }
}
