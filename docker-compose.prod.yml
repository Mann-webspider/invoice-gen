version: '3.8'

services:
  frontend:
    image: manndshelby/invoice-frontend:2.3
    container_name: frontend
    restart: unless-stopped 
    expose:
      - "3000"
    environment:
      - VITE_API_BASE_URL=/api
      - NODE_ENV=production
    networks:
      - appnet
    extra_hosts:  # ADD: Local DNS support
      - "invoice.zeric.com:host-gateway"
    healthcheck:  # ADD: Health monitoring
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: manndshelby/invoice-backend:1.1
    container_name: php-prod
    ports:
      - "8000:8000"
    networks:
      - appnet
    volumes:
      - ./storage:/var/www/html/storage
    restart: unless-stopped
    environment:  # ADD: License key
      - LICENSE_KEY=${LICENSE_KEY}
    extra_hosts:  # ADD: Local DNS support
      - "invoice.zeric.com:host-gateway"
    healthcheck:  # ADD: Health monitoring
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  # Add HTTPS port
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot/:ro  # For Let's Encrypt verification
      - ./certbot/conf:/etc/nginx/ssl/:ro   # SSL certificates
    depends_on:
      - frontend
      - backend
    networks:
      - appnet
    extra_hosts:  # ADD: Local DNS support
      - "invoice.zeric.com:host-gateway"
    healthcheck:  # ADD: Health monitoring
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot/:rw
      - ./certbot/conf:/etc/letsencrypt/:rw
    networks:  # ADD: Connect to network
      - appnet

networks:
  appnet:
    driver: bridge
